[project]
name = "netops-mcp"
version = "0.1.0"
description = "Servidor MCP con herramienta de redes: subredes, VLSM, diagnóstico y configuración de CISCO IOS"
readme = "README.md"
authors = [
    { name = "Ivan Tercero Barrios", email = "terceroivan2007@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
]

[project.scripts]
netops-mcp = "netops_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
